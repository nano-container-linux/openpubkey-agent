version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list
  build:
    desc: "Compiler l'application Swift (macOS)"
    cmds:
      - swift build -c release

  run:
    desc: "Lancer l'exécutable OpenPubkeyAgent (macOS)"
    deps: [build]
    cmds:
      - ./.build/release/OpenPubkeyAgent